<script>
/* =========================================================
   HR MANAGER ACTION PORTAL
   GitHub Pages / Single-file edition
   ---------------------------------------------------------
   IMPORTANT:
   - This is a static prototype.
   - Data is stored in the browser's localStorage.
   - Accounts/PINs are demo-level client-side controls.
   - Do NOT store confidential employee information in this version.
   - For real multi-user HR data, connect a backend such as
     Supabase/Firebase and real authentication.
   ========================================================= */

// Optional future secure backend: connect AI through a server/API proxy. Never place an AI API key in this file.
const CONFIG = {
  organisation: "HR Action Hub",
  storageKey: "hr_manager_action_portal_v2",
  sessionKey: "hr_manager_action_session_v2",
  demoData: true,
  users: [
    { id:"MGR001", name:"Sarah Jenkins", role:"manager", department:"Engineering", pin:"1234" },
    { id:"MGR002", name:"David Ross", role:"manager", department:"Sales & Business Dev", pin:"1234" },
    { id:"HR001", name:"HR Administrator", role:"hr", department:"Human Resources", pin:"9999" }
  ],
  departments:["Engineering","Finance","Operations","Sales & Business Dev","Customer Success","Product & Design","Human Resources"],
  categories:["Performance Issue","Skill Gap","Career Growth","Attendance & Conduct","Communication","Other"],
  actions:["Coaching / Mentoring","Training Course","Performance Improvement Plan (PIP)","Verbal Warning","Written Warning","Role Change / Transfer","Formal HR Investigation","Career Development Plan","No Action – Monitor"],
  urgency:["Low","Medium","High"],
  statuses:["Pending Review","Under HR Review","Action In Progress","Resolved / Completed","Escalated"]
};

const DEMO_CASES = [
 {id:"CASE-1001",employeeName:"Alexander Wright",employeeId:"EMP-8021",department:"Engineering",managerId:"MGR001",manager:"Sarah Jenkins",category:"Performance Issue",action:"Performance Improvement Plan (PIP)",urgency:"High",status:"Pending Review",justification:"Missed sprint delivery commitments 3 consecutive times. Previous coaching discussions have not resolved the issue.",hrNotes:"Awaiting initial HR intake review.",followUpDate:"2026-10-01",createdAt:"2026-09-15T10:30:00",updatedAt:"2026-09-15T10:30:00",comments:[],audit:["2026-09-15 10:30 — Case submitted by Sarah Jenkins"]},
 {id:"CASE-1002",employeeName:"Jessica Lin",employeeId:"EMP-4102",department:"Product & Design",managerId:"MGR001",manager:"Sarah Jenkins",category:"Career Growth",action:"Career Development Plan",urgency:"Low",status:"Action In Progress",justification:"Consistently exceeds expectations and has demonstrated readiness for broader responsibilities.",hrNotes:"Career development discussion completed. Follow-up required in Q4.",followUpDate:"2026-11-15",createdAt:"2026-09-02T09:00:00",updatedAt:"2026-09-20T14:15:00",comments:[],audit:["2026-09-02 09:00 — Case submitted by Sarah Jenkins","2026-09-20 14:15 — Status changed to Action In Progress by HR Administrator"]},
 {id:"CASE-1003",employeeName:"Marcus Brody",employeeId:"EMP-3019",department:"Sales & Business Dev",managerId:"MGR002",manager:"David Ross",category:"Skill Gap",action:"Training Course",urgency:"Medium",status:"Under HR Review",justification:"Requires advanced enterprise negotiation training to strengthen capability for tier-1 sales opportunities.",hrNotes:"Training sponsorship under HR review.",followUpDate:"2026-10-10",createdAt:"2026-09-18T16:20:00",updatedAt:"2026-09-22T11:00:00",comments:[],audit:["2026-09-18 16:20 — Case submitted by David Ross","2026-09-22 11:00 — Status changed to Under HR Review by HR Administrator"]},
 {id:"CASE-1004",employeeName:"Elena Rostova",employeeId:"EMP-9281",department:"Customer Success",managerId:"MGR001",manager:"Sarah Jenkins",category:"Attendance & Conduct",action:"Written Warning",urgency:"High",status:"Resolved / Completed",justification:"Repeated attendance concerns after previous counselling and documented discussion with manager.",hrNotes:"Written warning completed and acknowledged. Attendance to be monitored.",followUpDate:"2026-12-01",createdAt:"2026-08-10T11:10:00",updatedAt:"2026-09-01T09:30:00",comments:[],audit:["2026-08-10 11:10 — Case submitted by Sarah Jenkins","2026-09-01 09:30 — Status changed to Resolved / Completed by HR Administrator"]}
];

let state = { cases:[], activeTab:"Dashboard", search:"", status:"ALL", category:"ALL", urgency:"ALL" };
let currentUser = null;
let editingCaseId = null;

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO = () => new Date().toISOString();
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString("en-MY",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const today = () => new Date().toISOString().slice(0,10);
const isHR = () => currentUser?.role === "hr";

function save(){
  localStorage.setItem(CONFIG.storageKey, JSON.stringify({cases:state.cases}));
}
function load(){
  try{
    const raw=localStorage.getItem(CONFIG.storageKey);
    if(raw){ const parsed=JSON.parse(raw); state.cases=Array.isArray(parsed.cases)?parsed.cases:[]; }
    else { state.cases=CONFIG.demoData ? structuredClone(DEMO_CASES) : []; save(); }
  }catch(e){ state.cases=CONFIG.demoData ? structuredClone(DEMO_CASES) : []; }
}
function loadSession(){
  try{
    const id=sessionStorage.getItem(CONFIG.sessionKey);
    currentUser=CONFIG.users.find(u=>u.id===id)||null;
  }catch(e){currentUser=null}
}
function setSession(user){
  currentUser=user;
  sessionStorage.setItem(CONFIG.sessionKey,user.id);
  state.activeTab="Dashboard"; render();
}
function logout(){
  sessionStorage.removeItem(CONFIG.sessionKey);
  currentUser=null; render();
}
function toast(message,type=""){
  const el=document.createElement("div");
  el.className="toast "+type;el.textContent=message;
  $("toastRoot").appendChild(el);setTimeout(()=>el.remove(),2800);
}
function badge(text,type){
  const map={"Pending Review":"b-pending","Under HR Review":"b-review","Action In Progress":"b-progress","Resolved / Completed":"b-complete","Escalated":"b-escalated",Low:"b-low",Medium:"b-medium",High:"b-high"};
  return `<span class="badge ${map[text]||"b-review"}">${esc(text)}</span>`;
}
function visibleCases(){
  let list=isHR()?state.cases:state.cases.filter(c=>c.managerId===currentUser.id);
  const q=state.search.toLowerCase();
  if(q) list=list.filter(c=>[c.id,c.employeeName,c.employeeId,c.manager,c.department,c.category,c.action].some(v=>String(v).toLowerCase().includes(q)));
  if(state.status!=="ALL") list=list.filter(c=>c.status===state.status);
  if(state.category!=="ALL") list=list.filter(c=>c.category===state.category);
  if(state.urgency!=="ALL") list=list.filter(c=>c.urgency===state.urgency);
  return list.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
}

function normaliseHRQuestion(q){
  return q.toLowerCase().replace(/[^\w\s-]/g," ").replace(/\s+/g," ").trim();
}
function getHRAssistAnswer(question){
  const q=normaliseHRQuestion(question);
  if(!q) return "Please type a question and I'll help guide you.";
  let best=null,bestScore=0;
  HR_ASSIST_FAQ.forEach(item=>{
    let score=0;
    item.keys.forEach(k=>{
      const key=normaliseHRQuestion(k);
      if(q.includes(key)) score += key.length > 8 ? 4 : 2;
      key.split(" ").forEach(word=>{if(word.length>3 && q.includes(word)) score += 0.5});
    });
    if(score>bestScore){bestScore=score;best=item}
  });
  if(best && bestScore>=2) return best.answer;
  return "I can help with <b>case submission, manager justification, status meanings, PIP guidance, HR review, follow-up dates, CSV/JSON export, access, privacy, and GitHub Pages setup</b>. Try asking one of those.";
}

}
